<style>

.serif{font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-weight:300;letter-spacing:-.025em}
#app{height:100dvh;max-width:480px;margin:auto;position:relative;overflow:hidden;background:var(--bg)}
.s{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.s.on{display:flex;animation:in .35s ease}

b,strong,h1,h2,h3,h4{font-weight:400}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:300;color:inherit;border:0;background:none;cursor:pointer}
.btn{font-weight:400;background:var(--acc);color:#fff;border-radius:14px;padding:14px 20px;font-weight:400;width:100%}

.vf i{position:absolute;width:44px;height:44px;border:4px solid var(--acc)}

.vf i:nth-of-type(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-of-type(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-of-type(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 14px 0}

.acts{width:100%;display:flex;flex-direction:column;gap:10px;padding:0 24px 24px}

.tc{flex:none;position:relative;overflow:hidden;display:flex;align-items:stretch;justify-content:flex-start;gap:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:86px;transition:background .25s,border-color .25s;animation:in .45s both;animation-delay:calc(var(--d)*70ms)}

const IMG={food:"photo-1504674900247-0877df9cc836",coffee:"photo-1495474472287-4d71bcdd2085",fashion:"photo-1441986300917-64674bd600d8",travel:"photo-1488646953014-85cb44e25828",beauty:"photo-1522335789203-aabd1fc54bc9",shopping:"photo-1556742049-0cfed4f6a45d"};
const CATN={food:"Food",coffee:"Café",fashion:"Fashion",travel:"Travel",beauty:"Beauty",shopping:"Shopping"};
let S={},mode="",busy=0,hist=[],inCall=0,rec=null,tmr=null;

function go(id){document.querySelectorAll(".s").forEach(s=>s.classList.toggle("on",s.id==="s-"+id))}
function toast(t){const d=document.createElement("div");d.className="tt";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function reset(){S={i:0,info:{}};hist=[];$("#msgs").innerHTML="";$("#chips").innerHTML="";mode=""}

/* 1 · QR */
let stream=null,scanOn=0;
$("#cam").onclick=async()=>{
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=$("#vid");v.srcObject=stream;await v.play();
  if(!("BarcodeDetector"in window)){toast("Auto-scan unsupported — use demo QR");return}
  const d=new BarcodeDetector({formats:["qr_code"]});scanOn=1;
  (async function l(){if(!scanOn)return;try{const r=await d.detect(v);if(r.length){found();return}}catch(e){}setTimeout(l,300)})();
 }catch(e){toast("Camera blocked — use demo QR")}};
$("#demo").onclick=()=>found();
function found(){scanOn=0;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;navigator.vibrate&&navigator.vibrate(60);load()}

/* 2 · Loading */
async function load(){go("load");const m=["Verifying QR code…","Finding your gratification…","Preparing your programme…"];
 requestAnimationFrame(()=>$("#pb").style.width="100%");
 for(const t of m){$("#lt").textContent=t;await sleep(900)}
 $("#pb").style.width="0";types()}

/* 3 · Types */
function types(){let pk=-1;const cb=$("#tc");cb.disabled=true;cb.textContent="Select a reward";
 $("#tl").innerHTML=TYPES.map((t,i)=>`<button class="tc" data-i="${i}" style="--d:${i}"><div class="st"><b class="serif">${t[0]}</b><small>${t[1]}</small></div><div class="bd"><b class="serif">${t[2]}</b><span>${t[3]}</span></div></button>`).join("");
 go("type");const all=document.querySelectorAll(".tc");
 all.forEach(b=>b.onclick=()=>{pk=+b.dataset.i;all.forEach(x=>x.classList.toggle("sel",x===b));cb.disabled=false;cb.innerHTML=`Continue with ${TYPES[pk][2]}${ic("arrow-right",18)}`;navigator.vibrate&&navigator.vibrate(15)});
 cb.onclick=()=>{if(pk<0)return;reset();S.type=TYPES[pk][2];startChat()};
 $("#tb").onclick=()=>go("scan")}

/* 4 · Chat */
function msg(t,w="b"){const d=document.createElement("div");d.className="m "+w;d.textContent=t;$("#msgs").append(d);sc();return d}
function sc(){const m=$("#msgs");m.scrollTop=m.scrollHeight}
async function bot(t,ms=550){const d=document.createElement("div");d.className="m b dots";d.innerHTML="<i></i><i></i><i></i>";$("#msgs").append(d);sc();await sleep(ms);d.remove();return msg(t)}
function chips(l,cb){const c=$("#chips");c.innerHTML="";l.forEach(v=>{const b=document.createElement("button");b.textContent=v;b.onclick=()=>{c.innerHTML="";cb(v)};c.append(b)})}
async function startChat(){go("chat");await bot(`Hi! I'm your Avail assistant. You selected "${S.type}". Let's get you your reward.`);ask()}
async function ask(){const s=STEPS[S.i];busy=1;await bot(s.q);busy=0;mode="flow";chips(s.c||[],send)}
function send(v){v=(v||"").trim();if(!v||busy)return;$("#ti").value="";$("#chips").innerHTML="";msg(v,"u");
 if(mode==="flow"){const s=STEPS[S.i];if(s.v&&!s.v.test(v)){bot(s.e);return}
  S.info[s.k]=s.k==="code"?v.toUpperCase():v;S.i++;S.i<STEPS.length?ask():findOffers()}
 else if(mode==="upi")upiIn(v);
 else if(mode==="ai")chat(v)}
$("#sd").onclick=()=>send($("#ti").value);$("#ti").onkeydown=e=>{if(e.key==="Enter")send($("#ti").value)};
$("#bk").onclick=()=>{stopCall();go("type")};

/* Groq */
const sys=()=>`You are Avail, a warm assistant for a "${S.type}" gratification programme. User: ${JSON.stringify(S.info)}. ${S.offer?"Chosen offer: "+JSON.stringify(S.offer)+".":""} Reply in under 35 words, friendly, no markdown.`;
async function groq(m,json){if(!GROQ_KEY||GROQ_KEY.startsWith("YOUR"))throw 0;
 const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+GROQ_KEY},body:JSON.stringify({model:MODEL,messages:m,temperature:.7,max_tokens:400,...(json?{response_format:{type:"json_object"}}:{})})});
 if(!r.ok)throw 0;return(await r.json()).choices[0].message.content}
async function ai(t){hist.push({role:"user",content:t});let a;try{a=await groq([{role:"system",content:sys()},...hist.slice(-10)])}catch(e){a="I'm offline right now, but your offer is saved. Tap an offer above to continue."}hist.push({role:"assistant",content:a});return a}
async function chat(t){busy=1;const d=document.createElement("div");d.className="m b dots";d.innerHTML="<i></i><i></i><i></i>";$("#msgs").append(d);sc();const a=await ai(t);d.remove();msg(a);busy=0}

/* 5 · Offers */
async function findOffers(){busy=1;await bot("Checking your code "+S.info.code+"…",700);await bot("Code verified. Finding the best offers for you…",800);
 let o;try{const j=await groq([{role:"system",content:"Return ONLY JSON: {\"offers\":[{\"brand\":\"\",\"cat\":\"\",\"title\":\"\",\"desc\":\"\",\"value\":\"\",\"code\":\"\"}]} with exactly 3 realistic offers from 3 different fictional brands (never real company names). cat must be one of food, coffee, fashion, travel, beauty, shopping. title ≤5 words, value ≤10 chars, code 5-8 uppercase chars. Match the user and programme."},{role:"user",content:`Programme: ${S.type}. User: ${JSON.stringify(S.info)}`}],1);o=JSON.parse(j).offers.slice(0,3);if(!o.length)throw 0}catch(e){o=FALLBACK}
 S.offers=o;await bot(`Here are 3 offers for you, ${S.info.name}. Avail via chat or voice call:`);
 o.forEach((x,i)=>{const d=document.createElement("div");d.className="oc";
  const u=`https://images.unsplash.com/${IMG[x.cat]||IMG.shopping}?auto=format&fit=crop&w=700&q=60`;
  d.style.backgroundImage=`url("${u}"),linear-gradient(135deg,#b9dcd7,#e8f4f2)`;
  d.innerHTML=`<div class="ob"><div class="bp"><span class="lg">${esc((x.brand||"A")[0].toUpperCase())}</span><div><b>${esc(x.brand||"Avail")}</b><small>${CATN[x.cat]||"Offer"}</small></div></div><span class="v">${esc(String(x.value))}</span></div><h4 class="serif">${esc(x.title)}</h4><p>${esc(x.desc)}</p><div class="r"><button class="c" data-i="${i}">${ic("message-circle",16)}Chat</button><button class="v2" data-i="${i}">${ic("phone",16)}Voice</button></div>`;
  d.querySelector(".c").onclick=()=>availChat(i);d.querySelector(".v2").onclick=()=>openCall(i);$("#msgs").append(d)});
 sc();busy=0;mode="ai"}
async function availChat(i){if(busy)return;S.offer=S.offers[i];busy=1;msg("I'll avail: "+S.offer.title,"u");
 let t;try{t=await groq([{role:"system",content:sys()},{role:"user",content:"Confirm my offer and tell me in one line how to redeem it."}])}catch(e){t=`Your "${S.offer.title}" is confirmed. Show the code below at checkout.`}
 await bot(t);busy=0;coupon()}
function coupon(){const o=S.offer,d=document.createElement("div");d.className="cp";
 d.innerHTML=`<small>Your coupon</small><h3 class="serif">${esc(o.code)}</h3><div class="r"><button class="g">${ic("copy",16)}Copy</button></div>`;
 d.querySelector("button").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(o.code);toast("Coupon copied")};
 $("#msgs").append(d);sc();bonus()}

/* 6 · UPI bonus */
async function bonus(){busy=1;mode="";await bot("Bonus: you've also earned a ₹"+(S.amt=[21,51,101][Math.floor(Math.random()*3)])+" UPI reward. Share your UPI ID to receive it (example: name@upi).",900);busy=0;mode="upi"}
async function upiIn(v){if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v)){bot("That doesn't look like a UPI ID. Use the format name@bank.");return}
 busy=1;S.upi=v;await bot("Sending ₹"+S.amt+" to "+v+"…",900);const ref="AVL"+Date.now().toString(36).toUpperCase().slice(-6);S.ref=ref;
 await bot("Reward queued. Share your reward code with friends — they get a bonus too.");
 const d=document.createElement("div");d.className="cp";
 d.innerHTML=`<small>UPI reward code · ₹${S.amt}</small><h3 class="serif">${ref}</h3><div class="r"><button class="sh">${ic("share",16)}Share</button><button class="g cb">${ic("copy",16)}Copy</button><button class="g nw">${ic("plus",16)}New</button></div>`;
 const tx=`I got ₹${S.amt} UPI reward from Avail Offers! Use my code ${ref} to claim yours.`;
 d.querySelector(".sh").onclick=()=>navigator.share?navigator.share({text:tx}).catch(()=>{}):location.href="https://wa.me/?text="+encodeURIComponent(tx);
 d.querySelector(".cb").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(tx);toast("Copied")};
 d.querySelector(".nw").onclick=()=>{stopCall();go("scan")};
 $("#msgs").append(d);sc();busy=0;mode="ai"}

/* Voice (VoIP-style) */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("#vc").onclick=()=>S.offers?openCall(0):toast("Complete the steps first");
$("#mic").onclick=()=>{if(!SR)return toast("Voice input unsupported");const r=new SR();r.lang="en-IN";r.onresult=e=>send(e.results[0][0].transcript);r.start();toast("Listening…")};
function speak(t){return new Promise(r=>{if(!speechSynthesis)return r();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-IN";u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}
async function openCall(i){if(!SR){toast("Voice not supported on this browser");return}
 if(S.offers)S.offer=S.offers[i];go("call");inCall=1;$("#av").classList.add("live");let s=0;clearInterval(tmr);
 tmr=setInterval(()=>{s++;$("#tm").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1e3);
 const g=`Hi ${S.info.name||""}! I'm Avail. Your offer from ${S.offer.brand||"us"} is ${S.offer.title}. Say "confirm" to claim it, or ask me anything.`;
 $("#tr").textContent=g;await speak(g);listen()}
function listen(){if(!inCall)return;const r=rec=new SR();r.lang="en-IN";let got=0;
 r.onresult=async e=>{got=1;const t=e.results[0][0].transcript;$("#tr").textContent="You: "+t;
  const a=await ai(t);if(!inCall)return;$("#tr").textContent=a;await speak(a);
  if(/confirm|claim|yes|avail/i.test(t)){endCall(1);return}listen()};
 r.onerror=()=>{};r.onend=()=>{if(inCall&&!got)setTimeout(listen,400)};try{r.start()}catch(e){}}
function stopCall(){inCall=0;clearInterval(tmr);rec&&rec.abort&&rec.abort();speechSynthesis&&speechSynthesis.cancel();$("#av").classList.remove("live")}
function endCall(done){stopCall();go("chat");if(done&&S.offer){msg("Claimed by voice: "+S.offer.title,"u");coupon()}}
$("#end").onclick=()=>endCall(0);
reset();hyd();
/* GSAP shape-morph logo */
const N=72,TH=[...Array(N)].map((_,i)=>i/N*Math.PI*2),A=Math.abs,C=Math.cos,SN=Math.sin;
const SH=[t=>4.5+6.5*A(C(6*t))**3,t=>7.5+3.5*C(6*t),()=>9,t=>9/(C(t)**4+SN(t)**4)**.25,t=>2.5+8.5*A(C(2*t))**3,t=>4.5+6.5*C(4*t)**2];
let cur=TH.map(SH[0]);
const draw=()=>{const d="M"+cur.map((r,i)=>(12+r*C(TH[i])).toFixed(2)+" "+(12+r*SN(TH[i])).toFixed(2)).join("L")+"Z";document.querySelectorAll(".sp").forEach(e=>e.setAttribute("d",d))};
function morph(k){const f=cur.slice(),t=TH.map(SH[k%SH.length]),o={p:0};
 gsap.to(o,{p:1,duration:1.3,delay:.8,ease:"power3.inOut",onUpdate(){cur=f.map((v,i)=>v+(t[i]-v)*o.p);draw()},onComplete:()=>morph(k+1)})}
draw();
if(window.gsap&&!matchMedia("(prefers-reduced-motion:reduce)").matches){morph(1);gsap.to(".star",{rotation:"+=360",duration:18,ease:"none",repeat:-1})}
</script></body></html>
